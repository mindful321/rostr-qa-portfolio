# Netlify: static pages from /site, API functions from /netlify/functions.
[build]
  publish = "site"
  functions = "netlify/functions"
  # The only build step: copy the golden dataset so the Test results page can show it.
  command = "mkdir -p site/data && cp tests/evals/golden_dataset.json site/data/golden_dataset.json"

[functions]
  node_bundler = "esbuild"

# API routes come from each function's `config.path` (e.g. /api/v1/shifts).

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
