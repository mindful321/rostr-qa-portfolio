# Netlify: static pages from /site, API functions from /netlify/functions.
[build]
  publish = "site"
  functions = "netlify/functions"
  # No build step yet: the site is plain HTML/CSS.
  command = ""

[functions]
  node_bundler = "esbuild"

# API routes come from each function's `config.path` (e.g. /api/v1/shifts).

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
