name: tests

on:
  push:
  pull_request:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium

      # For now the site is static, so we serve it locally.
      # Later this job will run against the Netlify deploy preview instead.
      - name: Serve the site
        run: python -m http.server 8888 --directory site &

      - name: Run tests
        run: pytest --base-url http://localhost:8888 --browser chromium
