name: tests

on:
  push:
    branches-ignore: [results]
  pull_request:

jobs:
  unit:
    name: unit (payroll + time rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test "tests/unit/*.test.ts"

  api-and-evals:
    name: api + assistant evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      # Local stand-in for Netlify: serves site/ and runs the API functions.
      - name: Start the Rostr dev server
        run: |
          node scripts/dev-server.mjs 8888 &
          for i in $(seq 1 20); do curl -sf http://localhost:8888/api/v1/health && break; sleep 1; done
      - run: pytest -m "api or evals" --base-url http://localhost:8888

  ui:
    name: ui + a11y (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install test dependencies
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Start the Rostr dev server
        run: |
          node scripts/dev-server.mjs 8888 &
          for i in $(seq 1 20); do curl -sf http://localhost:8888/api/v1/health && break; sleep 1; done
      - name: Run UI and accessibility tests
        run: pytest -m "ui or a11y" --base-url http://localhost:8888 --browser ${{ matrix.browser }} --screenshot only-on-failure --tracing retain-on-failure
      - name: Keep screenshots and traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: test-results/

  docker-compose:
    name: docker compose (Postgres + SQL checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run app + Postgres + test suite
        run: docker compose up --build --abort-on-container-exit --exit-code-from tests
      - name: Show app logs on failure
        if: failure()
        run: docker compose logs app db
      - name: Keep the JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-results
          path: test-results/

  release-gate:
    name: release gate (clean must pass, bug mode must catch all 10 bugs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install test dependencies
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Start the Rostr dev server
        run: |
          node scripts/dev-server.mjs 8888 &
          for i in $(seq 1 20); do curl -sf http://localhost:8888/api/v1/health && break; sleep 1; done
      - name: Run 1 - clean build
        run: pytest -m "ui or api or evals" --base-url http://localhost:8888 --browser chromium --junitxml=clean.xml || true
      - name: Run 2 - bug mode (failures expected)
        run: pytest -m "ui or api or evals" --bug-mode --base-url http://localhost:8888 --browser chromium --junitxml=bugged.xml || true
      - name: GO / NO-GO
        run: python scripts/release_gate.py --clean clean.xml --bugged bugged.xml --out results.json
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-results
          path: |
            results.json
            clean.xml
            bugged.xml

  publish-results:
    # After the gate runs on main, publish results.json to the `results` branch.
    # The Test results page reads it from there, so the numbers on the site are always the latest real run.
    name: publish results to the site
    needs: release-gate
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-gate-results
      - name: Push results.json to the results branch
        run: |
          mkdir out && cp results.json out/
          cd out
          git init -q -b results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.json
          git commit -q -m "Test results for ${GITHUB_SHA::7} (run #${GITHUB_RUN_NUMBER})"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" results
