name: tests

on:
  push:
  pull_request:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Local stand-in for Netlify: serves site/ and runs the API functions.
      # Later this job will run against the Netlify deploy preview instead.
      - name: Start the Rostr dev server
        run: |
          node scripts/dev-server.mjs 8888 &
          for i in $(seq 1 20); do curl -sf http://localhost:8888/api/v1/health && break; sleep 1; done

      - name: Run tests
        run: pytest --base-url http://localhost:8888 --browser chromium
